  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'hi',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          },
          'google_translate_element'
        );
      }
      // Defer the Google Translate widget until after the page has fully
      // loaded so it never competes with first paint / LCP.
      window.addEventListener('load', function () {
        var inject = function () {
          var s = document.createElement('script');
          s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          s.async = true;
          document.body.appendChild(s);
        };
        if ('requestIdleCallback' in window) requestIdleCallback(inject, { timeout: 3000 });
        else setTimeout(inject, 1500);
      });
    </script>
